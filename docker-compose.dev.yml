# Local development database only. Production stack: docker-compose.yml.
# Start: docker compose -f docker-compose.dev.yml up -d
# Separate project name, so it never shares containers or volumes with the
# production stack in docker-compose.yml.
name: autokarta-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: autokarta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: autokarta
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18+ images keep data in /var/lib/postgresql/<major>/docker,
      # so the volume is mounted one level up (lets pg_upgrade work in place).
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autokarta"]
      interval: 5s
      retries: 10

  # HTTPS for testing on a phone in the local network (camera needs it).
  # Start: docker compose -f docker-compose.dev.yml --profile https up -d
  # Then open https://<LAN_HOST>:8443 (Vite must run with `npm run dev -- --host`).
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    environment:
      LAN_HOST: ${LAN_HOST:-localhost}
    ports:
      - "8443:8443"
    volumes:
      - ./deploy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres:
  caddy_data:
