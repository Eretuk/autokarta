# Local development database only. Production stack: docker-compose.yml.
# Start: docker compose -f docker-compose.dev.yml up -d
# Separate project name, so it never shares containers or volumes with the
# production stack in docker-compose.yml.
name: autokarta-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: autokarta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: autokarta
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autokarta"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
