# Production: app + PostgreSQL + daily backups.
# HTTPS is terminated by an external reverse proxy that forwards to APP_BIND
# (default 127.0.0.1:8080).
#   cp .env.example .env   # set POSTGRES_PASSWORD
#   docker compose up -d --build
#   docker compose exec app autokarta create-admin --username owner
name: autokarta

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autokarta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: autokarta
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autokarta -d autokarta"]
      interval: 5s
      retries: 10

  app:
    build: .
    image: autokarta:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://autokarta:${POSTGRES_PASSWORD}@db:5432/autokarta
      # Always true in production: the browser talks HTTPS to the proxy.
      COOKIE_SECURE: "true"
    ports:
      - "${APP_BIND:-127.0.0.1:8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: autokarta
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: autokarta
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
