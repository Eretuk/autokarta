# Production: app + PostgreSQL + daily backups. Every setting comes from .env
# next to this file (template: .env.example); a missing one stops `docker
# compose` with a message naming it. HTTPS is terminated by an external
# reverse proxy that forwards to APP_BIND. Setup: README, "Production".
name: autokarta

# How every service reaches the database.
x-database: &database
  PGHOST: db
  PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # PostgreSQL 18+ keeps its files in <dir>/18/docker, so a future major
      # version can be upgraded next to it in the same directory.
      - ${DATA_DIR:?set DATA_DIR in .env}/db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      retries: 10

  app:
    # Published by CI to ghcr.io; `build` is used only with --build.
    image: ${AUTOKARTA_IMAGE:?set AUTOKARTA_IMAGE in .env}
    build: .
    restart: unless-stopped
    environment:
      <<: *database
      # Only the host here: user, password and database come from the PG*
      # variables above, so any characters in the password work (a "/" or
      # "+" inside a URL breaks parsing).
      DATABASE_URL: postgres://db:5432
      # Always true in production: the browser talks HTTPS to the proxy.
      COOKIE_SECURE: "true"
    ports:
      - "${APP_BIND:?set APP_BIND in .env}:8080"
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      <<: *database
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:?set BACKUP_KEEP_DAYS in .env}
      BACKUP_TIME: ${BACKUP_TIME:?set BACKUP_TIME in .env}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${DATA_DIR}/backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
