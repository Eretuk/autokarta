# Production: app + PostgreSQL (+ optional daily backups). This file and .env
# next to it (template: .env.example) are all the server needs. Every setting
# comes from .env; a missing one stops `docker compose` with a message naming
# it. HTTPS is terminated by an external reverse proxy that forwards to
# APP_BIND. Setup: README, "Production".
name: autokarta

# How every service reaches the database.
x-database: &database
  PGHOST: db
  PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # PostgreSQL 18+ keeps its files in <dir>/18/docker, so a future major
      # version can be upgraded next to it in the same directory.
      - ${DATA_DIR:?set DATA_DIR in .env}/db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      retries: 10

  app:
    # Published by CI to ghcr.io; `build` is used only with --build.
    image: ${AUTOKARTA_IMAGE:?set AUTOKARTA_IMAGE in .env}
    build: .
    restart: unless-stopped
    environment:
      <<: *database
      # Only the host here: user, password and database come from the PG*
      # variables above, so any characters in the password work (a "/" or
      # "+" inside a URL breaks parsing).
      DATABASE_URL: postgres://db:5432
      # Always true in production: the browser talks HTTPS to the proxy.
      COOKIE_SECURE: "true"
    ports:
      - "${APP_BIND:?set APP_BIND in .env}:8080"
    depends_on:
      db:
        condition: service_healthy

  # Daily pg_dump into <DATA_DIR>/backups. Enabled by COMPOSE_PROFILES=backup
  # in .env; leave it out when the databases are backed up centrally.
  backup:
    image: ${AUTOKARTA_IMAGE}
    profiles: ["backup"]
    restart: unless-stopped
    # Root only to write into <DATA_DIR>/backups, which Docker creates as root.
    user: root
    entrypoint: ["autokarta-backup"]
    environment:
      <<: *database
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:?set BACKUP_KEEP_DAYS in .env}
      BACKUP_TIME: ${BACKUP_TIME:?set BACKUP_TIME in .env}
    volumes:
      - ${DATA_DIR}/backups:/backups
    depends_on:
      db:
        condition: service_healthy
