# Production: app + PostgreSQL. This file and .env
# next to it (template: .env.example) are all the server needs. The app
# version is pinned here; settings and secrets come from .env, and a missing
# one stops `docker compose` with a message naming it. HTTPS is terminated by
# an external reverse proxy that forwards to APP_BIND. Setup: README,
# "Production". Every release attaches the matching copy of this file.
name: autokarta

# The app version. Not a secret, so it lives here and not in .env (which is
# often kept encrypted): to update, change it or download this file again from
# the new release. CI checks it against the release tag.
x-image: &image ghcr.io/eretuk/autokarta:0.3.0

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # PostgreSQL 18+ keeps its files in <dir>/18/docker, so a future major
      # version can be upgraded next to it in the same directory.
      - ${DATA_DIR:?set DATA_DIR in .env}/db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      retries: 10

  app:
    # Published by CI to ghcr.io; `build` is used only with --build.
    image: *image
    build: .
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Only the host here: user, password and database come from the PG*
      # variables above, so any characters in the password work (a "/" or
      # "+" inside a URL breaks parsing).
      DATABASE_URL: postgres://db:5432
      # Always true in production: the browser talks HTTPS to the proxy.
      COOKIE_SECURE: "true"
      # Optional settings with defaults (see .env.example), so installs from
      # before they existed keep working.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private}
      UPDATE_CHECK: ${UPDATE_CHECK:-true}
    ports:
      - "${APP_BIND:?set APP_BIND in .env}:8080"
    depends_on:
      db:
        condition: service_healthy
    # The image's HEALTHCHECK runs `autokarta healthcheck`; `docker compose ps`
    # shows "healthy". Logs are capped: the first start prints a password.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
