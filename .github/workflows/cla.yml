name: CLA

# Asks every outside contributor to sign CLA.md by commenting on their pull
# request, and blocks the merge until they do (make "CLA" a required status
# check in the branch protection of main). Signatures are committed as JSON
# to the branch `cla-signatures`, which must exist: create it once with
#   git switch --orphan cla-signatures && git commit --allow-empty -m "CLA signatures" && git push -u origin cla-signatures
#
# pull_request_target runs with write access even for pull requests from
# forks, so this workflow must never check out or run their code: it only
# reads comments and writes the signature file and the status.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/Eretuk/autokarta/blob/main/CLA.md
          branch: cla-signatures
          allowlist: Eretuk,dependabot[bot]
